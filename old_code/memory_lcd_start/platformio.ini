[env:esp32-s3-wroom-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Forced Safe Mode (Quad SPI)
board_build.arduino.memory_type = qio_qio
board_build.flash_mode = qio
board_upload.flash_size = 4MB

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps = 
	adafruit/Adafruit SHARP Memory Display@^1.1.4
	adafruit/Adafruit GFX Library@^1.12.5
	madhephaestus/ESP32Encoder@^0.12.0
